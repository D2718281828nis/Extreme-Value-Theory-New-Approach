[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"
[project]
name="evt-educational-demo"
version="0.2.0"
description="Two-component EVT detection and GAT source localization on graph time series"
requires-python=">=3.10"
dependencies=["numpy>=1.24","pandas>=2.0","scipy>=1.10","scikit-learn>=1.3","matplotlib>=3.7","torch>=2.0","torch-geometric>=2.4"]
[project.optional-dependencies]
dev=["pytest>=7.0","jupyter>=1.0"]
[tool.pytest.ini_options]
testpaths=["tests"]
addopts="-q"
pythonpath=["src"]
