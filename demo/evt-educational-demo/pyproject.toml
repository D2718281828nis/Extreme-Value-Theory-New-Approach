[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evt-educational-demo"
version = "0.1.0"
description = "Автономная учебная демонстрация Extreme Value Theory"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "matplotlib>=3.7",
  "scikit-learn>=1.3", "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["jupyter>=1.0", "pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
