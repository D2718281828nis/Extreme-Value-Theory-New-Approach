name: tests

# Fold composition is platform-independent (src/folds.py) and the reference was not edited past the R1 sync
# (reference_results/R1_SYNC.json). The full comparison with dissertation-calculations needs a local copy of it:
# python scripts/check_sync_with_r1.py --r1 ../dissertation-calculations
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy pandas scikit-learn pytest
      - run: pytest -q tests
